name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run frontend build
        run: npm run build

      - name: Run Tauri debug build
        run: npm run tauri build -- --debug

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoNotes-windows-debug
          path: src-tauri/target/debug/so-notes.exe
          if-no-files-found: error
