name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build release app
        run: npm run tauri build

      - name: Rename release asset
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Rename-Item -Path "src-tauri/target/release/so-notes.exe" -NewName "SoNotes-$tag.exe"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content "CHANGELOG.md" -Raw
          $pattern = "(?s)## \[$([regex]::Escape($tag))\](.*?)(?=## \[v|$)"

          if ($content -match $pattern) {
            $body = $matches[0].Trim()
          } else {
            Write-Error "CHANGELOG.md 中未找到 $tag 对应版本区块。"
          }

          if (gh release view $tag *> $null) {
            gh release edit $tag --title $tag --notes $body
          } else {
            gh release create $tag --title $tag --notes $body
          }

          gh release upload $tag "src-tauri/target/release/SoNotes-$tag.exe" --clobber
